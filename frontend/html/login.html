<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathExpedition - Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <main>
        <header>
            <h1>Math<span>Expedition</span></h1>
            <h2 id="login-titulo">Ingreso de Estudiantes</h2>
            <p id="login-descripcion">¡Hola explorador! Introduce tu usuario y contraseña para continuar la aventura.</p>
        </header>

        <section id="botones-logins">
            <button type="button" id="btn-estudiante" class="btn-tab active">Soy Estudiante</button>
            <button type="button" id="btn-profesor" class="btn-tab">Soy Profesor</button>
        </section>

        <form id="form-login" novalidate>
            
            <section id="campo-identificador">
                <label id="label-identificador" for="identificador">Nombre de Perfil</label>
                <input type="text" id="identificador" name="identificador" placeholder="Ej. ExploradorMate" required>
            </section>

            <section>
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </section>

            <section id="contenedor-error">
                <p id="texto-error">Aquí se mostrará el error correspondiente.</p>
            </section>

            <button type="submit" id="btn-login">¡Comenzar Expedición!</button>
        </form>

        <footer id="footer-login">
            <p>¿No tienes una cuenta? <a href="registro-profesor.html">Regístrate aquí</a></p>
        </footer>
    </main>

    <script src="../js/login.js"></script>
</body>
</html>
