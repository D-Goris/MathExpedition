<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathExpedition - Crear Ejercicio</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/crear-ejercicio.css">
</head>

<body>
    <main> 
        <header>
            <h1>Math<span>Expedition</span></h1>
            <h2>Nuevo Reto Matemático</h2>
            <p>Diseña un ejercicio de selección simple para tus alumnos.</p>
        </header>

        <form id="form-crear-ejercicio" novalidate>
            
            <section>
                <label for="tema">Tema de la Expedición</label>
                <select id="tema" name="tema" required>
                    <option value="" disabled selected>Selecciona un tema...</option>
                    </select>
                
                <input type="text" id="nuevo-tema" name="nuevo-tema" placeholder="Escribe el nombre del nuevo tema" style="display: none; margin-top: 10px;">
            </section>

            <section>
                <label for="pregunta">Planteamiento del Problema</label>
                <textarea id="pregunta" name="pregunta" placeholder="Ej. Si Juan tiene 5 manzanas y compra 3 más, ¿cuántas tiene en total?" required></textarea>
            </section>

            <section>
                <label>Opciones de Respuesta</label>
                <div class="contenedor-opciones">
                    <input type="text" id="opcion-a" placeholder="Opción A" required>
                    <input type="text" id="opcion-b" placeholder="Opción B" required>
                    <input type="text" id="opcion-c" placeholder="Opción C" required>
                    <input type="text" id="opcion-d" placeholder="Opción D" required>
                </div>
            </section>

            <section>
                <label for="respuesta-correcta">¿Cuál es la respuesta correcta?</label>
                <select id="respuesta-correcta" name="respuesta-correcta" required>
                    <option value="" disabled selected>Indica la opción ganadora...</option>
                    <option value="A">Opción A</option>
                    <option value="B">Opción B</option>
                    <option value="C">Opción C</option>
                    <option value="D">Opción D</option>
                </select>
            </section>

            <section id="contenedor-error">
                <p id="texto-error">Aquí se mostrará el error correspondiente.</p>
            </section>

            <button type="submit" id="btn-guardar-ejercicio">Guardar Ejercicio</button>
        </form>

        <footer>
            <p><a href="menu-profesor.html">Volver al Panel del Profesor</a></p>
        </footer>
    </main>

    <script src="../js/crear-ejercicio.js"></script>
</body>
</html>
