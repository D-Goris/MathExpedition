<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathExpedition - Asignar Misiones</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/asignar-ejercicios.css">
</head>
<body>
    <main>
        <header>
            <h1>Math<span>Expedition</span></h1>
            <h2>Asignar Grupo de Ejercicios</h2>
            <p>Envía un bloque de retos matemáticos a un salón de estudiantes específico.</p>
        </header>

        <form id="form-asignar-ejercicios" novalidate>
            <section>
                <label for="select-grupo-ejercicios">Selecciona el Grupo de Ejercicios (Misión)</label>
                <select id="select-grupo-ejercicios" required>
                    <option value="" disabled selected>Elige un paquete de retos...</option>
                </select>
            </section>

            <section>
                <label for="select-grupo-estudiantes">Selecciona el Grupo de Estudiantes (Salón)</label>
                <select id="select-grupo-estudiantes" required>
                    <option value="" disabled selected>Elige el salón de destino...</option>
                </select>
            </section>

            <section id="contenedor-error" style="display: none;">
                <p id="texto-error"></p>
            </section>

            <p id="mensaje-exito" style="display: none; color: #16a34a; text-align: center; font-weight: bold; margin-bottom: 1rem;"></p>

            <button type="submit" id="btn-enviar-mision">Asignar y Publicar Misión</button>
        </form>

        <footer>
            <p><a href="menu-profesor.html">Volver al Panel del Profesor</a></p>
        </footer>
    </main>

    <script src="../js/asignar-ejercicios.js"></script>
</body>
</html>
